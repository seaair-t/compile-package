name: Build atomcode-daemon (Windows)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, commit SHA) to build'
        required: false
        default: 'main'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          repository: atomgit-atomcode/atomcode

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-cargo-

      # webui/dist/ 在仓库里不存在，rust-embed 需要该目录存在才能编译
      - name: Create webui/dist/ placeholder
        shell: bash
        run: |
          mkdir -p webui/dist
          cat > webui/dist/index.html << 'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>AtomCode Daemon</title></head>
          <body><p>AtomCode Daemon running. Connect your client.</p></body>
          </html>
          EOF

      - name: Build
        run: |
          cargo build -p atomcode-daemon --release --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: atomcode-daemon-windows-amd64
          path: target\x86_64-pc-windows-msvc\release\atomcode-daemon.exe

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target\x86_64-pc-windows-msvc\release\atomcode-daemon.exe
          append_body: true
