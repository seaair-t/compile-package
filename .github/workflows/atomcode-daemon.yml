name: Build atomcode-daemon

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, commit SHA) to build'
        required: false
        default: 'main'
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: atomcode-daemon
            asset_suffix: linux-amd64

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: atomcode-daemon
            asset_suffix: macos-amd64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: atomcode-daemon
            asset_suffix: macos-arm64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: atomcode-daemon.exe
            asset_suffix: windows-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          repository: atomgit-atomcode/atomcode

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cargo build -p atomcode-daemon --release --target ${{ matrix.target }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build -p atomcode-daemon --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: atomcode-daemon-${{ matrix.asset_suffix }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          append_body: true
